<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>¿PREPARADA?</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    cursor:pointer;

    background:linear-gradient(
        -45deg,
        #5f2cff,
        #7b2ff7,
        #4f46e5,
        #2563eb,
        #3b82f6,
        #7b2ff7
    );

    background-size:400% 400%;

    animation:fondoLava 15s ease infinite;
}

.container{
    text-align:center;
    padding:20px;
}

h1{
    color:white;
    font-size:3.2rem;
    font-weight:900;
    text-shadow:0 5px 20px rgba(0,0,0,.25);
    animation:flotar 3s ease-in-out infinite;
}

p{
    margin-top:30px;
    color:white;
    font-size:1.1rem;
    letter-spacing:1px;
    opacity:.8;
    animation:parpadeo 2s ease-in-out infinite;
}

@keyframes flotar{
    0%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-15px);
    }
    100%{
        transform:translateY(0px);
    }
}

@keyframes parpadeo{
    0%,100%{
        opacity:0;
    }
    50%{
        opacity:1;
    }
}

@media(max-width:600px){

    h1{
        font-size:2.6rem;
    }

    p{
        font-size:1rem;
    }

}

@keyframes fondoLava{

    0%{
        background-position:0% 50%;
    }

    25%{
        background-position:50% 100%;
    }

    50%{
        background-position:100% 50%;
    }

    75%{
        background-position:50% 0%;
    }

    100%{
        background-position:0% 50%;
    }

}
</style>
</head>

<body onclick="continuar()">

<div class="container">

    <h1>¿PREPARADA?</h1>

    <p>Pulsa para continuar</p>

</div>

</body>
</html>
